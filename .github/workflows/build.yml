name: build
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: AMBOSS-Anki-Queue-Windows }
          - { os: macos-latest,   name: AMBOSS-Anki-Queue-Mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install customtkinter pyinstaller
      - run: pyinstaller --noconfirm --windowed --onefile --collect-data customtkinter --name "${{ matrix.name }}" queue_app.py
        shell: bash
      - if: runner.os == 'macOS'
        run: cd dist && zip -r "${{ matrix.name }}.zip" "${{ matrix.name }}.app"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
